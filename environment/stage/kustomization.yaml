apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - namespace.yaml

patches:
  - path: deployment_env.yaml
  - path: frontend-container-security-context.yaml
  - path: backend-container-security-context.yaml
  - path: ingress.yaml
  - path: deployment_hpa.yaml

namespace: gitops-demo-stage

nameSuffix: -stage

labels:
  - pairs:
      env: stage
    includeSelectors: true

images:
  - name: pentago/gitops-demo-backend
    newName: pentago/gitops-demo-backend
    newTag: 10b202a
  - name: pentago/gitops-demo-frontend
    newName: pentago/gitops-demo-frontend
    newTag: 670658e
